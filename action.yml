name: LintLang Agent Config Linter
description: Statically lint AI agent configs, tool definitions, and prompts with LintLang.
author: Hermes Labs

branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: File or directory containing agent instructions to scan.
    required: true
  fail-on:
    description: "Raw-mode verdict threshold when gate is false. Leave empty for an advisory raw scan; set to 'fail' for FAIL or 'review' for FAIL and REVIEW. The default gate uses KEEP decisions to block regardless of this input."
    required: false
    default: ""
  gate:
    description: "Use the learned finding gate and block KEEP decisions (default true). Set to false to scan raw detector findings and use fail-on severity thresholds."
    required: false
    default: "true"
  baseline:
    description: Optional existing baseline file. Only unmatched findings affect the verdict; CI never creates a baseline.
    required: false
    default: ""
  python-version:
    description: Python version used to run LintLang.
    required: false
    default: "3.12"
  sarif-file:
    description: Optional path for SARIF 2.1.0 output. When omitted, terminal output is unchanged.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LintLang
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Scan agent instructions
      if: inputs.sarif-file == ''
      shell: bash
      env:
        LINTLANG_PATH: ${{ inputs.path }}
        LINTLANG_GATE: ${{ inputs.gate }}
        LINTLANG_FAIL_ON: ${{ inputs.fail-on }}
        LINTLANG_BASELINE: ${{ inputs.baseline }}
      run: |
        LINTLANG_ARGS=(scan "$LINTLANG_PATH")
        case "$LINTLANG_GATE" in
          true) ;;
          false) LINTLANG_ARGS+=(--no-gate) ;;
          *) echo "Error: gate must be 'true' or 'false'." >&2; exit 2 ;;
        esac
        LINTLANG_FAIL_ON_TRIMMED="$(python -c 'import sys; print(sys.argv[1].strip())' "$LINTLANG_FAIL_ON")"
        if [ -n "$LINTLANG_FAIL_ON_TRIMMED" ]; then
          LINTLANG_ARGS+=(--fail-on "$LINTLANG_FAIL_ON_TRIMMED")
        fi
        if [ -n "$LINTLANG_BASELINE" ]; then
          LINTLANG_ARGS+=(--baseline "$LINTLANG_BASELINE")
        fi
        lintlang "${LINTLANG_ARGS[@]}"

    - name: Scan agent instructions to SARIF
      if: inputs.sarif-file != ''
      shell: bash
      env:
        LINTLANG_PATH: ${{ inputs.path }}
        LINTLANG_GATE: ${{ inputs.gate }}
        LINTLANG_FAIL_ON: ${{ inputs.fail-on }}
        LINTLANG_BASELINE: ${{ inputs.baseline }}
        LINTLANG_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        LINTLANG_PATH_REAL="$(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$LINTLANG_PATH")"
        LINTLANG_SARIF_REAL="$(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$LINTLANG_SARIF_FILE")"
        if [ "$LINTLANG_PATH_REAL" = "$LINTLANG_SARIF_REAL" ]; then
          echo "Error: inputs path and sarif-file must differ." >&2
          exit 1
        fi
        LINTLANG_ARGS=(scan "$LINTLANG_PATH" --format sarif)
        case "$LINTLANG_GATE" in
          true) ;;
          false) LINTLANG_ARGS+=(--no-gate) ;;
          *) echo "Error: gate must be 'true' or 'false'." >&2; exit 2 ;;
        esac
        LINTLANG_FAIL_ON_TRIMMED="$(python -c 'import sys; print(sys.argv[1].strip())' "$LINTLANG_FAIL_ON")"
        if [ -n "$LINTLANG_FAIL_ON_TRIMMED" ]; then
          LINTLANG_ARGS+=(--fail-on "$LINTLANG_FAIL_ON_TRIMMED")
        fi
        if [ -n "$LINTLANG_BASELINE" ]; then
          LINTLANG_BASELINE_REAL="$(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$LINTLANG_BASELINE")"
          if [ "$LINTLANG_BASELINE_REAL" = "$LINTLANG_SARIF_REAL" ]; then
            echo "Error: inputs baseline and sarif-file must differ." >&2
            exit 1
          fi
          LINTLANG_ARGS+=(--baseline "$LINTLANG_BASELINE")
        fi
        if [ -d "$LINTLANG_SARIF_FILE" ]; then
          echo "Error: sarif-file must name a file, not a directory." >&2
          exit 1
        fi
        mkdir -p -- "$(dirname -- "$LINTLANG_SARIF_FILE")"
        LINTLANG_SARIF_TMP="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/lintlang-sarif.XXXXXX")"
        trap 'rm -f -- "$LINTLANG_SARIF_TMP"' EXIT
        LINTLANG_STATUS=0
        lintlang "${LINTLANG_ARGS[@]}" > "$LINTLANG_SARIF_TMP" || LINTLANG_STATUS=$?
        mv -- "$LINTLANG_SARIF_TMP" "$LINTLANG_SARIF_FILE"
        trap - EXIT
        exit "$LINTLANG_STATUS"
