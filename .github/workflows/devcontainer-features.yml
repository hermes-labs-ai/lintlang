name: Dev Container Feature

on:
  pull_request:
    paths:
      - "integrations/devcontainer/**"
      - ".github/workflows/devcontainer-features.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "integrations/devcontainer/**"
      - ".github/workflows/devcontainer-features.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Validate Feature metadata
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.5.1
        with:
          validate-only: true
          base-path-to-features: ./integrations/devcontainer/src
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.89.0
      - name: Test LintLang Feature
        working-directory: ./integrations/devcontainer
        run: devcontainer features test --skip-autogenerated -f lintlang .

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: devcontainer-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Verify publish credential is configured
        env:
          DEVCONTAINER_GHCR_TOKEN: ${{ secrets.DEVCONTAINER_GHCR_TOKEN }}
        run: test -n "${DEVCONTAINER_GHCR_TOKEN}"
      - name: Publish Feature and metadata namespace
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.5.1
        with:
          publish-features: true
          base-path-to-features: ./integrations/devcontainer/src
          generate-docs: false
          disable-repo-tagging: true
          devcontainer-cli-version: 0.89.0
        env:
          # The protected environment supplies a dedicated least-privilege
          # token with package publication authority; the job token stays read-only.
          GITHUB_TOKEN: ${{ secrets.DEVCONTAINER_GHCR_TOKEN }}
