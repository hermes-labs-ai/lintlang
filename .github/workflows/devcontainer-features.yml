name: Dev Container Feature

on:
  pull_request:
    paths:
      - "devcontainer-features/**"
      - ".github/workflows/devcontainer-features.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "devcontainer-features/**"
      - ".github/workflows/devcontainer-features.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Validate Feature metadata
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.5.1
        with:
          validate-only: true
          base-path-to-features: ./devcontainer-features/src
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.89.0
      - name: Test LintLang Feature
        run: devcontainer features test --skip-autogenerated -f lintlang ./devcontainer-features

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Publish Feature and metadata namespace
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.5.1
        with:
          publish-features: true
          base-path-to-features: ./devcontainer-features/src
          generate-docs: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
