name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest --tb=short -q

      - name: Exercise the pre-commit consumer hook
        if: matrix.python-version == '3.12'
        run: pre-commit try-repo . lintlang --files AGENTS.md --verbose

      - name: Self-scan samples
        run: lintlang scan samples/clean_config.yaml --format json

  action-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Action succeeds on a clean fixture
        uses: ./
        with:
          path: samples/clean_config.yaml

      - name: Action fails on a failing fixture
        id: failing-scan
        continue-on-error: true
        uses: ./
        with:
          path: samples/bad_tool_descriptions.yaml

      - name: Assert failing fixture returned failure
        env:
          ACTION_OUTCOME: ${{ steps.failing-scan.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"

      - name: Released Action writes clean SARIF
        uses: hermes-labs-ai/lintlang@175a9a19414aff9a1752d3b9850d6cf58d59fb32 # v0.7.0
        with:
          path: samples/clean_config.yaml
          sarif-file: lintlang-clean.sarif

      - name: Released Action writes failing SARIF
        id: released-failing-scan
        continue-on-error: true
        uses: hermes-labs-ai/lintlang@175a9a19414aff9a1752d3b9850d6cf58d59fb32 # v0.7.0
        with:
          path: samples/bad_tool_descriptions.yaml
          sarif-file: lintlang-bad.sarif

      - name: Assert released Action version, findings, and exit code
        env:
          BAD_ACTION_OUTCOME: ${{ steps.released-failing-scan.outcome }}
        run: |
          test "$BAD_ACTION_OUTCOME" = failure
          python - <<'PY'
          import json
          from pathlib import Path

          clean = json.loads(Path("lintlang-clean.sarif").read_text())
          bad = json.loads(Path("lintlang-bad.sarif").read_text())
          assert clean["version"] == bad["version"] == "2.1.0"
          for report in (clean, bad):
              assert report["runs"][0]["tool"]["driver"]["semanticVersion"] == "0.7.0"
          assert not clean["runs"][0]["results"]
          assert {"H1.1", "H3"} <= {result["ruleId"] for result in bad["runs"][0]["results"]}
          PY
